name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format
        run: dotnet format --verify-no-changes
      - name: Build
        run: dotnet build -warnaserror
      - name: Test
        run: dotnet test

  # Cloud sessions cannot push tags, so main tags itself (the owner's choice):
  # every CHANGELOG version without a tag is tagged on the first main commit
  # that added it.
  tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag versions
        run: |
          for version in $(grep -oP '^## \K\d+\.\d+\.\d+' CHANGELOG.md); do
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              continue
            fi
            commit=$(git log --first-parent --diff-merges=first-parent --reverse -S"## $version " --format=%H -- CHANGELOG.md | head -1)
            git tag "v$version" "$commit"
            git push origin "v$version"
          done
